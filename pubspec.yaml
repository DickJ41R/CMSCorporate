name: cms_web
description: "The Corporate Project"

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  any_date: ^1.0.3
  async: ^2.11.0
  cached_network_image: ^3.3.1
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  csv: ^7.1.0
  cupertino_icons: ^1.0.8
  dart_json_mapper: ^2.2.12+1
  desktop_window: ^0.4.2
  dio: ^5.9.0
  encrypt: ^5.0.3
  ffi: ^2.1.3
  file_picker: ^10.3.3
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  firebase_storage: ^13.0.2
  fl_chart: ^1.1.1
  flutter_constraintlayout: ^1.7.0-stable
  flutter_data_table: ^2.0.0
  flutter_dotenv: ^6.0.0
  flutter_exit_app: ^2.0.0
  flutter_fast_forms: ^18.1.0
  flutter_pdfview: ^1.4.4
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.2.1
  geolocator: ^14.0.2
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  http: ^1.5.0
  json_annotation: ^4.9.0
  logger: ^2.6.0
  mailer: ^7.1.0
  multi_dropdown: ^3.1.1
  open_filex: ^4.5.0
  path: any
  path_provider: ^2.1.3
  pdf: ^3.11.0
  shared_preferences: ^2.2.3
  syncfusion_flutter_signaturepad: ^33.2.10
  syncfusion_flutter_pdf: ^33.2.10
  syncfusion_flutter_core: ^33.2.10
  syncfusion_flutter_pdfviewer: ^33.2.10
  syncfusion_flutter_datepicker: ^33.2.10
  syncfusion_flutter_datagrid: ^33.2.10
  syncfusion_flutter_calendar: ^33.2.10
  dropdown_search: ^7.0.0
  dropdown_button2: ^3.0.0
  transparent_image: ^2.0.1
  universal_platform: ^1.1.0
  uuid: ^4.4.2
  window_manager: ^0.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  decimal: ^3.0.2
  http_parser: ^4.1.0
  collection: ^1.19.0
  meta: ^1.15.0
  intl: ^0.20.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 23 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "path/to/image.png"

build_runner: ^2.4.11
json_serializable: ^6.8.0
flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/logo.png
    - assets/config/
    - assets/icons/
    - images/
    - images/apple/
    - assets/theme/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsBold.ttf
          weight: 700
        - asset: assets/fonts/PoppinsRegular.ttf
          weight: 400
        - asset: assets/fonts/PoppinsSemiBold.ttf
          weight: 600

  # Enable generation of localized Strings from arb files.
  generate: true
